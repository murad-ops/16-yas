<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 Yaşın Mübarək!</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #ff4757;
            margin-top: 20px;
        }
        .cats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 5px solid #ff4757;
        }
        .audio-box {
            margin: 20px 0;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>Kawai və Çisli Pampaları səni təbrik edir! 16 yaşın mübarək! 🎉</h1>
    
    <div class="cats-container">
        <img src="kawai.jpg" alt="Kawai">
        <img src="Pampalari.jpg" alt="Çisli Pampaları">
    </div>

    <div class="audio-box">
        <p>🎵 Əsas Musiqi:</p>
        <audio controls autoplay loop>
            <source src="Music.mp3" type="audio/mpeg">
            Brauzeriniz musiqini dəstəkləmir.
        </audio>
    </div>
    
    <br>

    <div class="audio-box">
        <p>📢 Sürpriz Səs (Horn):</p>
        <audio controls>
            <source src="Horn.mp3" type="audio/mpeg">
            Brauzeriniz səsi dəstəkləmir.
        </audio>
    </div>

</body>
</html>
