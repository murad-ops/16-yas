<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 Yaşın Mübarək!</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ürək Yağmuru Effekti */
        .heart {
            position: absolute;
            top: -10px;
            color: #ff4757;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Zərf Ekranı */
        #envelope-container {
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s;
        }

        #envelope-container:hover {
            transform: scale(1.05);
        }

        .envelope {
            background: #ff4757;
            width: 280px;
            height: 180px;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #fff;
        }

        .envelope p {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Məktub və Məzmun Ekranı */
        #content-container {
            display: none;
            z-index: 10;
            max-width: 650px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(26, 26, 26, 0.97);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ff4757;
            box-shadow: 0 0 40px rgba(255, 71, 87, 0.4);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #ff4757;
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Fırlanan Şəkillər */
        .cats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .cats-container img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff4757;
            animation: spinIn 1.6s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        @keyframes spinIn {
            0% { transform: rotate(0deg) scale(0); }
            80% { transform: rotate(360deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .audio-box {
            margin: 15px 10px;
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #333;
        }

        audio {
            width: 100%;
            max-width: 260px;
            height: 35px;
            outline: none;
        }
        
        /* Scrollbar-ı tənzimləyək */
        #content-container::-webkit-scrollbar {
            width: 8px;
        }
        #content-container::-webkit-scrollbar-track {
            background: #1a1a1a; 
        }
        #content-container::-webkit-scrollbar-thumb {
            background: #ff4757; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Başlanğıcda Zərf -->
    <div id="envelope-container" onclick="openLetter()">
        <div class="envelope">
            <p>💌 Sənin üçün məktub var... Toxun aç</p>
        </div>
    </div>

    <!-- Məktub açıldıqdan sonra görünəcək hissə -->
    <div id="content-container">
        <h1>Kawai Murad, onun çisli pampaları, Leyla və onun Chikaawa ordusu sənin ad gününü təbrik edir, 16 yaşını tamamladığın üçün! 🎉</h1>
        
        <div class="cats-container">
            <img src="kawai.jpg" alt="Kawai">
            <img src="Pampalari.jpg" alt="Çisli Pampaları">
            <img src="sekil1.jpg" alt="Şəkil 1">
            <img src="sekil2.jpg" alt="Şəkil 2">
        </div>

        <div style="margin-top: 25px;">
            <div class="audio-box">
                <p style="margin: 0 0 5px 0; font-size: 13px; color: #aaa;">🎵 Əsas Musiqi:</p>
                <audio id="mainAudio" controls loop>
                    <source src="Music.mp3" type="audio/mpeg">
                </audio>
            </div>
            
            <div class="audio-box">
                <p style="margin: 0 0 5px 0; font-size: 13px; color: #aaa;">📢 Sürpriz Səs:</p>
                <audio id="hornAudio" controls>
                    <source src="Horn.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script>
        function openLetter() {
            // Zərfi gizlət, məktubu göstər
            document.getElementById('envelope-container').style.display = 'none';
            document.getElementById('content-container').style.display = 'block';

            // Musiqiləri avtomatik başlat (brauzer icazə verərsə)
            var mainAudio = document.getElementById('mainAudio');
            var hornAudio = document.getElementById('hornAudio');
            
            // Bəzi brauzerlər avtomatik oynatmaya mane ola bilər, ona görə "catch" əlavə edirik
            mainAudio.play().catch(e => console.log("Əsas musiqi avtomatik başlamadı: ", e));
            hornAudio.play().catch(e => console.log("Sürpriz səs avtomatik başlamadı: ", e));

            // Ürək yağmurunu başlat (hər 300 millisaniyədə bir ürək çıxır)
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            // Təsadüfi eniş mövqeyi
            heart.style.left = Math.random() * window.innerWidth + 'px';
            // Təsadüfi düşmə sürəti (2 ilə 5 saniyə arası)
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);

            // Ekrandan çıxandan sonra elementi sil ki, yaddaş dolmasın
            setTimeout(() => {
                heart.remove();
            }, 5000);
            
        }
    </script>
</body>
</html>
