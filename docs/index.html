<!DOCTYPE html><html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>16 Yaşın Mübarək!</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #1a1a1a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px 15px;
    }

    h1 {
        color: #ff4757;
        margin: 20px auto 35px;
        max-width: 900px;
        line-height: 1.4;
    }

    .cats-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        flex-wrap: wrap;
        margin: 30px auto;
    }

    .cat {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 15px;
        border: 5px solid #ff4757;
        display: block;
    }

    .audio-box {
        margin: 20px auto;
        padding: 15px 20px;
        border: 1px solid #444;
        border-radius: 10px;
        max-width: 500px;
        background: #222;
    }

    .audio-box p {
        margin-top: 0;
    }

    audio {
        width: 100%;
        max-width: 400px;
    }
</style>

</head><body><h1>
    Kawai və Çisli Pampaları səni təbrik edir!<br>
    16 yaşın mübarək! 🎉
</h1>

<div class="cats-container">
    <img class="cat" src="./kawai.jpg" alt="Kawai">
    <img class="cat" src="./Pampalari.jpg" alt="Çisli Pampaları">
</div>

<div class="audio-box">
    <p>🎵 Əsas Musiqi:</p>

    <audio controls loop>
        <source src="./Music.mp3" type="audio/mpeg">
        Brauzeriniz musiqini dəstəkləmir.
    </audio>
</div>

<div class="audio-box">
    <p>📢 Sürpriz Səs (Horn):</p>

    <audio controls>
        <source src="./Horn.mp3" type="audio/mpeg">
        Brauzeriniz səsi dəstəkləmir.
    </audio>
</div>

</body>
  </html>
